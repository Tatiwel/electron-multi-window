name: CI

on:
  push:
    branches: [pure-electron, pure-electron-development]
  pull_request:
    branches: [pure-electron, pure-electron-development]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node runs the Playwright test runner.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Electron >= 42 downloads its binary on first use; fetch it up front so
      # the download does not count against the first test's timeout.
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      # Ubuntu 24.04 blocks unprivileged user namespaces, which the Chromium
      # sandbox in Electron needs.
      - name: Allow Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # No build step: the tests launch Electron on the sources.
      - name: E2E tests
        run: xvfb-run -a bun run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
