name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]

jobs:
  lint-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Vite 8 requires Node.js ^20.19.0 || >=22.12.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Electron >= 42 downloads its binary on first use; fetch it up front so
      # the download does not count against the first test's timeout.
      - name: Download Electron binary
        run: |
          node "$(node -p "require.resolve('electron/install.js', { paths: ['apps/demo'] })")"

      # Ubuntu 24.04 blocks unprivileged user namespaces, which the Chromium
      # sandbox in Electron needs.
      - name: Allow Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Lint
        run: bun run lint

      # Builds the core, then type-checks and bundles the demo. Packaging
      # (electron-builder) is left out of CI: it downloads tools on every run.
      - name: Build
        run: bun run build

      - name: E2E tests
        run: xvfb-run -a bun run test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: apps/demo/test-results/
          retention-days: 7
